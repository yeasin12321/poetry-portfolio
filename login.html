<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login | Yeasin Kabir - Poems & Novels</title>
    
    <!-- আপনার ওয়েবসাইটের ফন্ট এবং স্টাইল শিট -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Hind+Siliguri:wght@300;400;600;700&family=Orbitron:wght@500&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* লগিন পেজকে স্ক্রিনের মাঝখানে রাখার জন্য কাস্টম স্টাইল */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at 50% 30%, #150a0d 0%, #070405 70%);
            margin: 0;
            overflow: hidden;
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 45px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
            z-index: 10;
        }
        .login-title {
            font-family: 'Cinzel', serif;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .login-subtitle {
            color: #c4b5a7;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 1.05rem;
            margin-bottom: 40px;
            font-style: italic;
            line-height: 1.6;
        }
        .g-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- ব্যাকগ্রাউন্ড গ্লো ইফেক্ট -->
    <div class="ambient-glow"></div>
    <div id="leaf-container"></div>
    
    <!-- লগিন বক্স -->
    <div class="vintage-paper-node login-container">
        <h1 class="login-title">Yeasin's World</h1>
        <p class="login-subtitle">"শব্দেরা যেখানে হারায়, নিস্তব্ধতা সেখানে কথা বলে..." <br><br> ওয়েবসাইটে প্রবেশ করতে আপনার গুগল একাউন্ট দিয়ে লগিন করুন।</p>
        
        <div class="g-btn-wrapper">
            <!-- Google Login Configuration (এখানে আপনার Client ID বসাবেন) -->
            <div id="g_id_onload"
                 data-client_id="856144695898-b88nh2ll39t5l0ui6fu7gi13ufj24fdc.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            
            <!-- Google Login Button -->
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_black"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="center">
            </div>
        </div>
    </div>

    <script>
        // JWT Token ডিকোড করার ফাংশন
        function decodeJwtResponse(token) {
            let base64Url = token.split('.')[1];
            let base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            let jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // গুগল থেকে লগিন রেসপন্স পাওয়ার পর যা ঘটবে
        function handleCredentialResponse(response) {
            const responsePayload = decodeJwtResponse(response.credential);
            
            // ইউজারের লগিন স্ট্যাটাস সেশনে সেভ করা হচ্ছে
            sessionStorage.setItem('yk_logged_in', 'true');
            sessionStorage.setItem('yk_user_name', responsePayload.name);
            sessionStorage.setItem('yk_user_email', responsePayload.email);
            
            // লগিন সফল হলে সরাসরি মূল ওয়েবসাইটে (index.html) রিডাইরেক্ট করবে
            window.location.href = 'index.html';
        }

        // ইউজার যদি আগে থেকেই লগিন করা থাকে, তবে তাকে পুনরায় লগিন করতে না দিয়ে সরাসরি ওয়েবসাইটে পাঠিয়ে দিবে
        window.onload = function() {
            if (sessionStorage.getItem('yk_logged_in') === 'true') {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
